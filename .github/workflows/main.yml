name: Build Wise Design Studio (Windows .exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_demucs:
        description: "Inclure Demucs (séparation de stems, build plus lourd)"
        type: boolean
        default: false
      windowed:
        description: "Sans fenêtre console (--windowed)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer PyTorch (CPU) et dépendances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1,<2.9" "torchaudio>=2.1,<2.9" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
          if ("${{ inputs.include_demucs }}" -eq "true") { pip install demucs }

      - name: Build PyInstaller
        shell: pwsh
        run: |
          $extra = ""
          if ("${{ inputs.windowed }}" -eq "true") { $extra = "--windowed" }
          python build_app.py $extra

      - name: Test de démarrage (smoke test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WiseDesignStudio\WiseDesignStudio.exe" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8765/api/status -TimeoutSec 5
              if ($r.app) { Write-Host "OK: $($r.app)"; $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "L'application n'a pas démarré (voir logs)" }

      - name: Archiver le livrable
        shell: pwsh
        run: |
          Copy-Item README.md dist\WiseDesignStudio\
          Compress-Archive -Path dist\WiseDesignStudio -DestinationPath WiseDesignStudio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WiseDesignStudio-windows
          path: WiseDesignStudio-windows.zip

      - name: Publier la release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WiseDesignStudio-windows.zip
