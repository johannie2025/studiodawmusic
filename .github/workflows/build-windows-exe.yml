name: Build Windows EXE (DAW IA Pro Standalone)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilation Windows x64 (PyInstaller Standalone)
    runs-on: windows-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ⚡ Configuration de Node.js pour le Frontend DAW
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installation des dépendances Frontend & Compilation Vite
        run: |
          npm install --include=optional
          npm run build

      - name: 🔧 Installation des dépendances Python (CPU-only PyTorch & AudioCraft)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Installation PyTorch CPU optimisé (sans CUDA pour un binaire léger)
          pip install torch==2.2.2+cpu torchaudio==2.2.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🏗️ Compilation de l'exécutable MonStudio.exe
        run: |
          python build_app.py

      - name: 📁 Vérification de l'arborescence finale
        shell: bash
        run: |
          ls -la dist/MonStudioChantres/
          echo "Arborescence créée :"
          find dist/MonStudioChantres/ -maxdepth 2

      - name: 🗜️ Compression du package Windows
        shell: bash
        run: |
          cd dist
          7z a -tzip MonStudio-DAW-IA-Windows-x64.zip MonStudioChantres/
          cd ..

      - name: 🚀 Publication de l'Artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MonStudio-DAW-IA-Windows-x64
          path: dist/MonStudio-DAW-IA-Windows-x64.zip
          retention-days: 30

      - name: 🏷️ Création d'une Release GitHub (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MonStudio-DAW-IA-Windows-x64.zip
          name: "DAW IA Pro Standalone v${{ github.ref_name }}"
          body: |
            ## 🎵 DAW IA Pro - MonStudio Chantres (Édition Hors-Ligne CPU)
            
            ### Contenu de l'archive :
            - `MonStudio.exe` : Lanceur exécutable autonome pour Windows 10/11
            - `_internal/` : Bibliothèques binaires Python, PyTorch CPU et dépendances
            - `models/` : Dossier dédié pour vos poids de modèles MusicGen et Demucs
            - `outputs/` : Dossier des instrumentaux générés et voix enregistrées
            
            ### Guide d'installation :
            1. Dézippez `MonStudio-DAW-IA-Windows-x64.zip` dans le dossier de votre choix (ex: `C:\MonStudioChantres\`).
            2. Placez vos modèles dans le dossier `models/musicgen-small/`.
            3. Double-cliquez sur `MonStudio.exe` !
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
